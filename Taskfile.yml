---
version: '3'

includes:
  mkdocs: ./src/taskfile-include-mkdocs.yaml
  pre-commit: ./src/taskfile-include-pre-commit.yaml
  worktree: ./src/taskfile-include-worktree.yaml

tasks:
  default:
    cmds:
      - task -l
    silent: true

  lint:
    desc: Run all pre-commit hooks
    cmds:
      - task: pre-commit:start

  docs:
    desc: Serve the mkdocs site locally
    cmds:
      - task: mkdocs:start

  test:
    desc: Run the repository self-tests (worktree:add prefix regression guard)
    cmds:
      - task: test:worktree

  test:worktree:
    desc: Exercise worktree:add for every allowed prefix against a throwaway repo
    cmds:
      - bash ./tests/worktree-selftest.sh
