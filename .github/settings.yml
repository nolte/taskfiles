---
# These settings are synced to GitHub by https://probot.github.io/apps/settings/

_extends: gh-plumbing:.github/commons-settings.yml

repository:
  name: taskfiles
  description: Collection of reusable Taskfiles
  homepage: https://nolte.github.io/taskfiles
  topics: task

# Required checks on develop. The commons config leaves `contexts` empty and
# expects each consumer to declare its own:
#   - "static / Static CI Tests": job `static` in build-static-tests.yaml,
#     which calls the gh-plumbing reusable pre-commit workflow.
#   - "task test": job `test` (named "task test") in ci.yml.
# The Settings app source passes `arrayMerge`, but probot 14's
# @fastify/deepmerge only honours `mergeArray`, so `_extends` arrays are
# concatenated and the commons master/develop entries are PUT as well. Whether
# the hosted app runs that code is unverified (nolte/gh-plumbing#442).
# Those commons entries set `restrictions.apps`, which GitHub accepts only on
# organization-owned repos, so they are expected to fail here. This entry sets
# `restrictions: null` and repeats every other field as a complete payload.
branches:
  - name: develop
    protection:
      required_pull_request_reviews: null
      required_status_checks:
        strict: true
        contexts:
          - "static / Static CI Tests"
          - "task test"
      enforce_admins: true
      restrictions: null
