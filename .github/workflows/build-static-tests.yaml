on:
  push:

jobs:
  static:
    uses: nolte/gh-plumbing/.github/workflows/reusable-pre-commit.yaml@80cb5ebb91a3b49126729de31b1037f11c34b5cd # v2.2.0

  security:
    uses: nolte/gh-plumbing/.github/workflows/reusable-trivy.yaml@80cb5ebb91a3b49126729de31b1037f11c34b5cd # v2.2.0
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status

  chain-bench:
    uses: nolte/gh-plumbing/.github/workflows/reusable-chain-bench.yaml@80cb5ebb91a3b49126729de31b1037f11c34b5cd # v2.2.0
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
