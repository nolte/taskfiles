# https://taskfile.dev

version: '3'

vars:
  # Per-machine root that holds every worktree. The NOLTE_WORKTREE_ROOT
  # environment variable wins at runtime; this var is only the fallback so
  # consumers that never set the env var still land in a predictable place.
  WORKTREE_ROOT_DEFAULT: "$HOME/repos/.worktrees"
  # Base ref new branches are cut from. Fetched before the worktree is added,
  # so it always starts from the remote tip regardless of the local checkout.
  WORKTREE_BASE_REF: "origin/develop"
  WORKTREE_FETCH_REMOTE: "origin"
  WORKTREE_FETCH_BRANCH: "develop"
  # Space-separated branch prefixes accepted by `add` (branching-model rule).
  # The path slug may drop the prefix, but the branch itself must carry one.
  WORKTREE_ALLOWED_PREFIXES: "feat fix chore docs exp"

tasks:
  root:
    desc: |
      Print the resolved worktree root for this machine. Reads
      NOLTE_WORKTREE_ROOT and falls back to ~/repos/.worktrees.
    dir: '{{.USER_WORKING_DIR}}'
    silent: true
    cmds:
      - 'echo "${NOLTE_WORKTREE_ROOT:-{{.WORKTREE_ROOT_DEFAULT}}}"'

  add:
    desc: |
      Create a parallel working copy (git worktree) under the configurable
      worktree root, always in the same predictable place:
        ${NOLTE_WORKTREE_ROOT:-~/repos/.worktrees}/<repo>/<slug>/
      The branch is created off {{.WORKTREE_BASE_REF}} with an explicit base
      ref and seeds a .resume/<slug>/plan.md plan stub (plan-before-work gate).
      Usage: task worktree:add -- <branch> [slug]
        task worktree:add -- feat/parser-fix
        task worktree:add -- chore/ci-tidy ci
    dir: '{{.USER_WORKING_DIR}}'
    silent: true
    cmds:
      - |
        set -euo pipefail

        allowed_prefixes="{{.WORKTREE_ALLOWED_PREFIXES}}"
        base_ref="{{.WORKTREE_BASE_REF}}"
        fetch_remote="{{.WORKTREE_FETCH_REMOTE}}"
        fetch_branch="{{.WORKTREE_FETCH_BRANCH}}"
        root_default="{{.WORKTREE_ROOT_DEFAULT}}"

        set -- {{.CLI_ARGS}}
        branch="${1:-}"
        slug="${2:-}"

        usage() {
          cat >&2 <<EOF
        Usage: task worktree:add -- <branch> [slug]

          <branch>  Full branch name including its prefix, e.g. feat/parser-fix.
                    Allowed prefixes: ${allowed_prefixes}
          [slug]    Optional kebab-case directory name under the worktree root.
                    Defaults to the branch name with its prefix stripped.

        The worktree is created at:
          \${NOLTE_WORKTREE_ROOT:-~/repos/.worktrees}/<repo>/<slug>/
        based on ${base_ref}.
        EOF
          exit 2
        }

        [ -n "$branch" ] || usage

        # reject <message> [hint]: print a branch-rule violation, plus the
        # case-specific hint when one is given, and abort.
        reject() {
          echo "✖ $1" >&2
          if [ -n "${2:-}" ]; then
            echo "  $2" >&2
          fi
          exit 1
        }
        slug_hint="The path slug may drop the prefix, but the branch MUST NOT."

        # Branch-prefix rule (branching-model). The slug may drop the prefix,
        # but the branch MUST carry one of the allowed prefixes.
        # NOTE: no bare `a && b` list on purpose. The embedded shell (mvdan/sh,
        # as shipped with go-task) lets a false `&&`/`||` list that ends a
        # compound command — such as a loop body — leak out as its exit status
        # and abort under `set -e`; bash exempts it (#50). `if`/`case` never
        # leak, so the loop below sets a flag from a `case` only.
        prefix="${branch%%/*}"
        if [ "$prefix" = "$branch" ] || [ -z "$prefix" ]; then
          reject "Branch '$branch' has no prefix; expected <prefix>/<name> with one of: ${allowed_prefixes}." "$slug_hint"
        fi
        # Exact token match against the IFS-split list (spaces, tabs, newlines
        # all separate) — never a substring match on the joined string.
        prefix_ok=0
        for allowed_prefix in $allowed_prefixes; do
          case "$prefix" in
            "$allowed_prefix") prefix_ok=1 ;;
          esac
        done
        if [ "$prefix_ok" -ne 1 ]; then
          reject "Branch '$branch' lacks an allowed prefix (${allowed_prefixes})." "$slug_hint"
        fi
        if [ -z "${branch#*/}" ]; then
          reject "Branch '$branch' has an empty name after '${prefix}/'; expected <prefix>/<name>." \
            "Add the name after the slash, e.g. ${prefix}/parser-fix."
        fi
        case "$branch" in
          *[[:space:]]*)
            reject "Branch '$branch' must not contain whitespace." \
              "Join the words with a dash instead, e.g. ${prefix}/parser-fix."
            ;;
        esac
        # Git's own ref-name rules, checked last so the specific messages above
        # win. `refs/heads/<branch>` instead of `--branch`: no repository is
        # needed and `@{-N}` is never expanded to a previous branch. Catches
        # `..`, `~`, `^`, `:`, a trailing `/` or `.lock`, and the like before
        # the banner, the fetch, or `git worktree add`.
        if ! git check-ref-format "refs/heads/$branch"; then
          reject "Branch '$branch' is not a valid git branch name." \
            "Avoid '..', '~', '^', ':', '?', '*', '[', '@{', a trailing '/' or '.lock'; see git check-ref-format."
        fi

        # Default slug: branch name minus the prefix segment.
        [ -n "$slug" ] || slug="${branch#*/}"

        # A slug MUST be a single path segment — never a traversal, a nested
        # path, `.` (the <repo> directory itself), a hidden name, or an
        # option-like leading dash.
        case "$slug" in
          */*|*..*|.*|-*|"")
            echo "✖ Slug '$slug' must be a single kebab-case path segment." >&2
            exit 1
            ;;
        esac

        # Resolve the configurable root. A leading ~ that arrives via the env
        # variable is not expanded by the shell, so expand it ourselves.
        root="${NOLTE_WORKTREE_ROOT:-$root_default}"
        case "$root" in
          "~") root="$HOME" ;;
          "~/"*) root="$HOME/${root#\~/}" ;;
        esac

        # Derive <repo> from the fetch remote — the same remote the base ref is
        # fetched from, never inferred from the cwd and never a hard-coded
        # `origin`. Every git call sits inside an `if` so a failure cannot
        # abort silently under `set -e`/`pipefail` (#50); each one reports
        # before any fetch or write.
        # KEEP IN SYNC: `add` and `remove` share the logic from here to the
        # `<repo>` sanity check (repository check, remote lookup, URL
        # normalisation), so both resolve the same <root>/<repo>/<slug>. Only
        # the hint lines of the messages differ between the two tasks.
        if ! git rev-parse --git-dir >/dev/null 2>&1; then
          echo "✖ Not inside a git repository: $PWD" >&2
          echo "  Run the task from a checkout of the repository to branch off." >&2
          exit 1
        fi
        if ! remote_list="$(git remote)"; then
          echo "✖ Cannot list the remotes of the repository at: $PWD" >&2
          exit 1
        fi
        remote_found=0
        remotes=""
        for remote_name in $remote_list; do
          case "$remote_name" in
            "$fetch_remote") remote_found=1 ;;
          esac
          remotes="${remotes:+$remotes }$remote_name"
        done
        if [ "$remote_found" -ne 1 ]; then
          if [ -z "$remotes" ]; then
            remotes="(none)"
          fi
          echo "✖ No remote '${fetch_remote}' to derive <repo> from (WORKTREE_FETCH_REMOTE)." >&2
          echo "  Existing remotes: ${remotes}" >&2
          echo "  Add it, then retry: git remote add ${fetch_remote} <url>" >&2
          echo "  WORKTREE_FETCH_REMOTE is the module's fixed default today; an" >&2
          echo "  includes:-site override is not honoured yet (nolte/taskfiles#57)." >&2
          exit 1
        fi
        # The remote exists, so any failure here is unexpected: git's own
        # stderr stays visible above the message.
        if ! fetch_url="$(git remote get-url "$fetch_remote")"; then
          echo "✖ Cannot read the URL of remote '${fetch_remote}' (see git's message above)." >&2
          exit 1
        fi
        # Normalise the fetch URL to <repo>: strip trailing slashes, keep the
        # part after the last `/` or `:` (scp-style `git@host:repo.git` has no
        # slash), strip `.git`. A result that is not a usable directory name
        # stops before any fetch or write.
        repo="$fetch_url"
        while :; do
          case "$repo" in
            */) repo="${repo%/}" ;;
            *) break ;;
          esac
        done
        repo="${repo##*/}"
        repo="${repo##*:}"
        repo="${repo%.git}"
        case "$repo" in
          ""|.|..)
            echo "✖ Cannot derive <repo> from URL '${fetch_url}' of remote '${fetch_remote}'." >&2
            echo "  Point the remote at a URL whose last path segment names the repository." >&2
            exit 1
            ;;
        esac

        dest="$root/$repo/$slug"
        if [ -e "$dest" ]; then
          echo "✖ Destination already exists: $dest" >&2
          exit 1
        fi

        echo "→ Worktree root : $root"
        echo "→ Repository    : $repo"
        echo "→ Branch        : $branch"
        echo "→ Destination   : $dest"

        # Fetch the base ref strictly non-interactively. GIT_TERMINAL_PROMPT=0
        # plus SSH BatchMode guarantees git can never fall into a credential or
        # passphrase prompt when the task runs from a non-interactive context
        # (a stale SSH_AUTH_SOCK between sessions was the cause of the
        # intermittent "no terminal" failure). If the remote is unreachable we
        # fall back to the last-known local base ref instead of aborting before
        # the worktree is even created.
        if ! GIT_TERMINAL_PROMPT=0 \
             GIT_SSH_COMMAND="${GIT_SSH_COMMAND:-ssh} -o BatchMode=yes -o ConnectTimeout=10" \
             git fetch "$fetch_remote" "$fetch_branch" --quiet < /dev/null; then
          if git rev-parse --verify --quiet "$base_ref^{commit}" >/dev/null; then
            echo "⚠ Could not reach ${fetch_remote} (offline, or no non-interactive" >&2
            echo "  credentials — check that ssh-agent is reachable via SSH_AUTH_SOCK)." >&2
            echo "  Falling back to the local ${base_ref}, which may be behind the remote." >&2
          else
            echo "✖ Could not fetch ${fetch_remote}/${fetch_branch} and no local" >&2
            echo "  ${base_ref} exists to fall back to. Make ssh-agent reachable" >&2
            echo "  (SSH_AUTH_SOCK) or ensure credentials work non-interactively, then retry." >&2
            exit 1
          fi
        fi
        git worktree add -b "$branch" "$dest" "$base_ref" < /dev/null

        # Plan-before-work gate: seed a foundational implementation-plan stub
        # inside the new worktree so a fresh resumable session can pick the
        # work up from a known starting point. It lives under .resume/ (gitignored).
        plan_dir="$dest/.resume/$slug"
        plan="$plan_dir/plan.md"
        mkdir -p "$plan_dir"

        cat > "$plan" <<EOF
        # Implementation plan: $slug

        > Foundational plan for worktree work on branch '$branch'. Authored BEFORE
        > substantive work begins, so a fresh, resumable top-level session started in
        > this worktree can pick the work up from a known starting point rather than
        > reconstructing intent from a half-finished diff.
        >
        > - Branch: $branch
        > - Worktree: $dest
        > - Base: ${base_ref}
        EOF

        cat >> "$plan" <<'EOF'

        ## 1. Goal

        <!-- What outcome does this worktree deliver? One or two sentences. -->

        ## 2. Current state (researched)

        <!-- Relevant specs, files, and prior art — the source of truth for the design. -->

        ## 3. Design decision

        <!-- The load-bearing choice, plus the open questions to confirm with the
             operator BEFORE work starts. -->

        ## 4. Work steps (ordered)

        1. <!-- first concrete step -->

        ## 5. Invariants / guardrails

        <!-- Rules carried over from CLAUDE.md and the governing specs that must hold. -->

        ## 6. Status / resume anchors

        - [ ] <!-- first task; the first unchecked box is where the next session resumes -->

        > Resume: cd into this worktree and run `task resume` (or `claude --resume`),
        > then continue this plan from the first unchecked box.
        EOF

        echo
        echo "✓ Worktree ready."
        echo
        echo "→ Plan-before-work gate: a plan stub was written to"
        echo "    .resume/$slug/plan.md inside the worktree."
        echo "    Fill it in BEFORE starting substantive work on this branch."
        echo
        echo "→ Start the work in a FRESH top-level session scoped to this worktree:"
        echo "    cd $dest && claude"

  remove:
    desc: |
      Remove a worktree created with `add`. Prunes the linked working copy;
      the branch itself is left intact so unmerged work is never lost. The
      seeded .resume/<slug>/plan.md counts as an untracked file, so pass
      `force` to drop a worktree that still holds uncommitted or untracked work.
      Usage: task worktree:remove -- <slug> [force]
    dir: '{{.USER_WORKING_DIR}}'
    silent: true
    cmds:
      - |
        set -euo pipefail

        root_default="{{.WORKTREE_ROOT_DEFAULT}}"
        fetch_remote="{{.WORKTREE_FETCH_REMOTE}}"

        set -- {{.CLI_ARGS}}
        slug="${1:-}"
        force_arg="${2:-}"

        if [ -z "$slug" ]; then
          echo "Usage: task worktree:remove -- <slug> [force]" >&2
          exit 2
        fi

        # Same slug rule as `add`: `.` would resolve to the <repo> directory.
        case "$slug" in
          */*|*..*|.*|-*) echo "✖ Slug '$slug' must be a single path segment." >&2; exit 1 ;;
        esac

        root="${NOLTE_WORKTREE_ROOT:-$root_default}"
        case "$root" in
          "~") root="$HOME" ;;
          "~/"*) root="$HOME/${root#\~/}" ;;
        esac

        # Same <repo> derivation as `add`: the fetch remote, reported if missing.
        # KEEP IN SYNC: `add` and `remove` share the logic from here to the
        # `<repo>` sanity check (repository check, remote lookup, URL
        # normalisation), so both resolve the same <root>/<repo>/<slug>. Only
        # the hint lines of the messages differ between the two tasks.
        if ! git rev-parse --git-dir >/dev/null 2>&1; then
          echo "✖ Not inside a git repository: $PWD" >&2
          echo "  Run the task from a checkout of the repository the worktree belongs to." >&2
          exit 1
        fi
        if ! remote_list="$(git remote)"; then
          echo "✖ Cannot list the remotes of the repository at: $PWD" >&2
          exit 1
        fi
        remote_found=0
        remotes=""
        for remote_name in $remote_list; do
          case "$remote_name" in
            "$fetch_remote") remote_found=1 ;;
          esac
          remotes="${remotes:+$remotes }$remote_name"
        done
        if [ "$remote_found" -ne 1 ]; then
          if [ -z "$remotes" ]; then
            remotes="(none)"
          fi
          echo "✖ No remote '${fetch_remote}' to derive <repo> from (WORKTREE_FETCH_REMOTE)." >&2
          echo "  Existing remotes: ${remotes}" >&2
          echo "  Add it (the remote the worktree was added with), then retry: git remote add ${fetch_remote} <url>" >&2
          echo "  WORKTREE_FETCH_REMOTE is the module's fixed default today; an" >&2
          echo "  includes:-site override is not honoured yet (nolte/taskfiles#57)." >&2
          exit 1
        fi
        # The remote exists, so any failure here is unexpected: git's own
        # stderr stays visible above the message.
        if ! fetch_url="$(git remote get-url "$fetch_remote")"; then
          echo "✖ Cannot read the URL of remote '${fetch_remote}' (see git's message above)." >&2
          exit 1
        fi
        # Normalise the fetch URL to <repo>: strip trailing slashes, keep the
        # part after the last `/` or `:` (scp-style `git@host:repo.git` has no
        # slash), strip `.git`. A result that is not a usable directory name
        # stops before any fetch or write.
        repo="$fetch_url"
        while :; do
          case "$repo" in
            */) repo="${repo%/}" ;;
            *) break ;;
          esac
        done
        repo="${repo##*/}"
        repo="${repo##*:}"
        repo="${repo%.git}"
        case "$repo" in
          ""|.|..)
            echo "✖ Cannot derive <repo> from URL '${fetch_url}' of remote '${fetch_remote}'." >&2
            echo "  Point the remote at a URL whose last path segment names the repository." >&2
            exit 1
            ;;
        esac
        dest="$root/$repo/$slug"

        if [ ! -e "$dest" ]; then
          echo "✖ No worktree at: $dest" >&2
          exit 1
        fi

        echo "→ Removing worktree: $dest"
        case "$force_arg" in
          force|--force|-f)
            git worktree remove --force "$dest"
            ;;
          "")
            if ! git worktree remove "$dest" 2>/dev/null; then
              echo "✖ Worktree still holds uncommitted or untracked work (e.g. the" >&2
              echo "  seeded .resume/$slug/plan.md). Re-run with force to discard it:" >&2
              echo "    task worktree:remove -- $slug force" >&2
              exit 1
            fi
            ;;
          *)
            echo "✖ Unknown second argument '$force_arg' (expected: force)." >&2
            exit 1
            ;;
        esac
        echo "✓ Worktree removed. The branch was left intact."

  list:
    desc: List the git worktrees registered for this repository.
    dir: '{{.USER_WORKING_DIR}}'
    cmds:
      - git worktree list
